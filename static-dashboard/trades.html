<!doctype html>
<!--
============================================================================
TICKET-ADV106 - Advanced data table (sortable, resizable, frozen header)
============================================================================
-->
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8" />
  <title>ReconX (static) - Trades</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="layout__header" role="banner">
    <h1 class="layout__title">ReconX</h1>
    <nav class="layout__nav" aria-label="Main navigation">
      <a href="dashboard.html">Dashboard</a>
      <a href="trades.html" aria-current="page">Trades</a>
      <a href="recon.html">Recon</a>
    </nav>
    <button id="theme-toggle" aria-label="Toggle light/dark theme">Theme</button>
  </header>

  <aside class="layout__sidebar" role="complementary">
    <h2>Trades view</h2>
    <p>Sort by clicking headers, drag the handles to resize, and scroll to keep the header pinned.</p>
  </aside>

  <main class="layout__main" role="main">
    <section aria-labelledby="trades-heading">
      <h2 id="trades-heading">Trades</h2>
      <div class="table-scroll">
        <table class="data-table" id="trades-table">
          <thead>
            <tr>
              <th data-col="tradeRef">Trade Ref <span class="resize-handle"></span></th>
              <th data-col="instrumentSymbol">Instrument <span class="resize-handle"></span></th>
              <th data-col="quantity" data-type="number">Quantity <span class="resize-handle"></span></th>
              <th data-col="price" data-type="number">Price <span class="resize-handle"></span></th>
              <th data-col="status">Status <span class="resize-handle"></span></th>
            </tr>
          </thead>
          <tbody id="trades-tbody"></tbody>
        </table>
      </div>
    </section>
  </main>

  <footer class="layout__footer" role="contentinfo">
    <small>ReconX TDI 2026 · static dashboard (Day 7)</small>
  </footer>

  <script src="js/theme.js"></script>
  <script src="js/trades.js"></script>
</body>
</html>
